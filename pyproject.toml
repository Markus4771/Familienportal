[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"

[project]
name="familienportal"
version="0.13.0"
description="Modulare, selbst gehostete Familienplattform"
readme="README.md"
requires-python=">=3.12"
authors=[{name="Familienportal-Projekt"}]
dependencies=["fastapi>=0.116,<1.0","uvicorn[standard]>=0.35,<1.0","pydantic-settings>=2.10,<3.0","email-validator>=2.2,<3.0","python-multipart>=0.0.20,<1.0","sqlalchemy>=2.0,<3.0","alembic>=1.16,<2.0","psycopg[binary]>=3.2,<4.0","jinja2>=3.1,<4.0","itsdangerous>=2.2,<3.0","cryptography>=49,<50","webauthn>=3,<4","qrcode[pil]>=8,<9"]

[project.optional-dependencies]
dev=["httpx>=0.28,<1.0","pytest>=8.4,<9.0","pytest-cov>=6.2,<7.0","ruff>=0.12,<1.0","mypy>=1.17,<2.0"]

[tool.hatch.build.targets.wheel]
packages=["src/familienportal"]
artifacts=["src/familienportal/templates/**","src/familienportal/static/**"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"

[tool.ruff]
target-version="py312"
line-length=120

[tool.ruff.lint]
select=["E","F","I","UP","B"]

[tool.mypy]
python_version="3.12"
strict=true
packages=["familienportal"]
