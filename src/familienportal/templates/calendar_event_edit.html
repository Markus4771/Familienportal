{% extends "base.html" %}
{% block title %}Termin bearbeiten · Familienportal{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-7"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Termin bearbeiten</h1><form method="post" action="/calendar/events/{{ event.id }}/edit"><div class="mb-3"><label class="form-label">Kalender</label><select class="form-select" name="calendar_id">{% for calendar in calendars %}<option value="{{ calendar.id }}" {% if calendar.id == event.calendar_id %}selected{% endif %}>{{ calendar.name }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Titel</label><input class="form-control" name="title" value="{{ event.title }}" required></div><div class="row g-3 mb-3"><div class="col"><label class="form-label">Beginn</label><input class="form-control" type="datetime-local" name="starts_at" value="{{ event.starts_at.strftime('%Y-%m-%dT%H:%M') }}" required></div><div class="col"><label class="form-label">Ende</label><input class="form-control" type="datetime-local" name="ends_at" value="{{ event.ends_at.strftime('%Y-%m-%dT%H:%M') }}" required></div></div><div class="mb-3"><label class="form-label">Ort</label><input class="form-control" name="location" value="{{ event.location or '' }}"></div><div class="mb-3"><label class="form-label">Beschreibung</label><textarea class="form-control" name="description" rows="4">{{ event.description or '' }}</textarea></div><div class="d-flex gap-2"><button class="btn btn-primary">Speichern</button><a class="btn btn-outline-secondary" href="/calendar/view">Abbrechen</a></div></form><hr><form method="post" action="/calendar/events/{{ event.id }}/move" class="row g-2 align-items-end"><div class="col"><label class="form-label">Termin verschieben</label><input class="form-control" type="datetime-local" name="new_start" value="{{ event.starts_at.strftime('%Y-%m-%dT%H:%M') }}"></div><div class="col-auto"><button class="btn btn-outline-primary">Verschieben</button></div></form><hr><form method="post" action="/calendar/events/{{ event.id }}/delete"><button class="btn btn-outline-danger">Termin löschen</button></form></div></div></div></div>
{% endblock %}
