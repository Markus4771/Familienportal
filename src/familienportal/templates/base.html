<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Familienportal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark portal-nav shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold" href="/dashboard"><i class="bi bi-people-fill me-2"></i>Familienportal</a>
    {% if user %}
    <div class="d-flex align-items-center gap-3 text-white">
      <span class="d-none d-md-inline">{{ user.display_name }}</span>
      {% if is_admin %}<a href="/admin" class="btn btn-sm btn-outline-light"><i class="bi bi-gear me-1"></i>Verwaltung</a>{% endif %}
      <form method="post" action="/logout"><button class="btn btn-sm btn-light">Abmelden</button></form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container-fluid px-4 py-4">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="container-fluid px-4 pb-4 text-secondary small">Familienportal · provisorische Oberfläche</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
