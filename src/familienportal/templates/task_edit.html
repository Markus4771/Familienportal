{% extends "base.html" %}
{% block title %}Aufgabe bearbeiten · Familienportal{% endblock %}
{% block content %}<h1>Aufgabe bearbeiten</h1><div class="card"><div class="card-body"><form method="post" action="/tasks/{{ task.id }}/edit" class="row g-3">
<div class="col-md-8"><label class="form-label">Titel</label><input class="form-control" name="title" value="{{ task.title }}" maxlength="240" required></div>
<div class="col-md-4"><label class="form-label">Priorität</label><select class="form-select" name="priority">{% for value,label in [('low','Niedrig'),('normal','Normal'),('high','Hoch'),('urgent','Dringend')] %}<option value="{{ value }}" {% if task.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Beschreibung</label><textarea class="form-control" name="description" rows="3">{{ task.description or '' }}</textarea></div>
<div class="col-md-4"><label class="form-label">Zuständig</label><select class="form-select" name="assignee_user_id"><option value="">Niemand</option>{% for member in users %}<option value="{{ member.id }}" {% if task.assignee_user_id == member.id %}selected{% endif %}>{{ member.display_name }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Haushalt</label><select class="form-select" name="household_id"><option value="">Alle / keiner</option>{% for household in households %}<option value="{{ household.id }}" {% if task.household_id == household.id %}selected{% endif %}>{{ household.name }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Fällig</label><input class="form-control" type="datetime-local" name="due_at" value="{{ task.due_at.strftime('%Y-%m-%dT%H:%M') if task.due_at else '' }}"></div>
<div class="col-md-4"><label class="form-label">Wiederholung</label><select class="form-select" name="recurrence"><option value="">Keine</option>{% for value,label in [('daily','Täglich'),('weekly','Wöchentlich'),('monthly','Monatlich'),('yearly','Jährlich')] %}<option value="{{ value }}" {% if task.recurrence == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Intervall</label><input class="form-control" type="number" min="1" max="365" name="recurrence_interval" value="{{ task.recurrence_interval }}"></div>
<div class="col-md-3 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="is_private" value="true" id="private" {% if task.is_private %}checked{% endif %}><label class="form-check-label" for="private">Private Aufgabe</label></div></div>
<div class="col-12"><button class="btn btn-primary">Speichern</button> <a class="btn btn-outline-secondary" href="/tasks">Abbrechen</a></div></form>
<hr><p class="small text-muted">Beim Archivieren bleibt die Aufgabe erhalten und kann später wiederhergestellt werden.</p><form method="post" action="/tasks/{{ task.id }}/archive" onsubmit="return confirm('Aufgabe archivieren?')"><button class="btn btn-outline-dark">Aufgabe archivieren</button></form></div></div>{% endblock %}
