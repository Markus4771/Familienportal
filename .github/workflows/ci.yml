name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        env:
          FAMILIENPORTAL_DATABASE_URL: sqlite:///./ci-familienportal.db
          FAMILIENPORTAL_SESSION_SECRET_KEY: ci-session-secret
          FAMILIENPORTAL_SECURITY_ENCRYPTION_KEY: ci-security-encryption-key
        run: pytest
