name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Syntax and shell check
        run: |
          python -m compileall -q src tests migrations
          bash -n deploy/install.sh deploy/release-install.sh deploy/familienportalctl deploy/familienportal-release packaging/build_deb.sh
      - name: Import integrity
        env: {FAMILIENPORTAL_DATABASE_URL: "sqlite:///./ci-imports.db", FAMILIENPORTAL_SESSION_SECRET_KEY: ci-session-secret, FAMILIENPORTAL_SECURITY_ENCRYPTION_KEY: ci-security-encryption-key}
        run: python -c 'import familienportal.main; print("imports ok")'
      - name: Tests
        env: {FAMILIENPORTAL_DATABASE_URL: "sqlite:///./ci-familienportal.db", FAMILIENPORTAL_SESSION_SECRET_KEY: ci-session-secret, FAMILIENPORTAL_SECURITY_ENCRYPTION_KEY: ci-security-encryption-key}
        run: pytest
      - name: Verify migrations and 0.12 upgrade baseline
        env: {FAMILIENPORTAL_DATABASE_URL: "sqlite:///./ci-migrations.db", FAMILIENPORTAL_SESSION_SECRET_KEY: ci-session-secret, FAMILIENPORTAL_SECURITY_ENCRYPTION_KEY: ci-security-encryption-key}
        run: |
          rm -f ci-migrations.db
          alembic upgrade 0020
          for revision in 0021 0022 0023; do alembic upgrade "$revision"; test "$(alembic current 2>/dev/null | awk 'NF {print $1}' | tail -1)" = "$revision"; done
          alembic downgrade 0020
          alembic upgrade head
          test "$(alembic current 2>/dev/null | awk 'NF {print $1}' | tail -1)" = "0023"
      - name: Build Debian package
        run: |
          chmod +x packaging/build_deb.sh
          FAMILIENPORTAL_DEB_VERSION=0.13.0~dev0 ./packaging/build_deb.sh
          dpkg-deb --info dist/familienportal_0.13.0~dev0_all.deb
          dpkg-deb --contents dist/familienportal_0.13.0~dev0_all.deb | grep -q opt/familienportal
      - name: Secret leakage guard
        run: |
          ! dpkg-deb --contents dist/familienportal_0.13.0~dev0_all.deb | grep -E '/\.env$|familienportal\.env$|\.git/'
