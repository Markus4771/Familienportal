name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Syntax check
        run: python -m compileall -q src tests migrations
      - name: Import integrity
        env:
          FAMILIENPORTAL_DATABASE_URL: sqlite:///./ci-imports.db
          FAMILIENPORTAL_SESSION_SECRET_KEY: ci-session-secret
          FAMILIENPORTAL_SECURITY_ENCRYPTION_KEY: ci-security-encryption-key
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import familienportal
          failures = []
          modules = sorted(module.name for module in pkgutil.walk_packages(familienportal.__path__, familienportal.__name__ + "."))
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append((name, type(exc).__name__, str(exc)))
          if failures:
              for name, error_type, message in failures:
                  print(f"IMPORT FAILED: {name}: {error_type}: {message}")
              raise SystemExit(1)
          print(f"Imported {len(modules)} familienportal modules successfully")
          PY
      - name: Test
        env:
          FAMILIENPORTAL_DATABASE_URL: sqlite:///./ci-familienportal.db
          FAMILIENPORTAL_SESSION_SECRET_KEY: ci-session-secret
          FAMILIENPORTAL_SECURITY_ENCRYPTION_KEY: ci-security-encryption-key
        run: pytest
      - name: Verify migrations 0013 to 0023
        env:
          FAMILIENPORTAL_DATABASE_URL: sqlite:///./ci-migrations.db
          FAMILIENPORTAL_SESSION_SECRET_KEY: ci-session-secret
          FAMILIENPORTAL_SECURITY_ENCRYPTION_KEY: ci-security-encryption-key
        run: |
          rm -f ci-migrations.db
          alembic upgrade 0013
          for revision in 0014 0015 0016 0017 0018 0019 0020 0021 0022 0023; do
            alembic upgrade "$revision"
            test "$(alembic current 2>/dev/null | awk 'NF {print $1}' | tail -1)" = "$revision"
          done
          alembic downgrade 0016
          test "$(alembic current 2>/dev/null | awk 'NF {print $1}' | tail -1)" = "0016"
          alembic upgrade head
